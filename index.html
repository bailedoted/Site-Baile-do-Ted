<script>
        // Adicionamos um número aleatório no final para o navegador não usar o cache
        fetch('agenda.json?v=' + Math.random())
            .then(response => {
                if (!response.ok) throw new Error('Ficheiro agenda.json não encontrado');
                return response.json();
            })
            .then(data => {
                const container = document.getElementById('agenda-dinamica');
                container.innerHTML = ''; 

                if (data && data.shows && data.shows.length > 0) {
                    data.shows.forEach(show => {
                        const card = `
                            <div class="show-item">
                                <img src="${show.arte}" alt="Arte do Evento" class="show-arte">
                                <div class="show-info">
                                    <div class="show-data">${show.data}</div>
                                    <div class="show-local">${show.local}</div>
                                </div>
                                <a href="#contato" class="btn-lista">${show.botao_texto || 'Mais Info'}</a>
                            </div>
                        `;
                        container.innerHTML += card;
                    });
                } else {
                    container.innerHTML = '<p>Nenhum evento agendado no momento.</p>';
                }
            })
            .catch(err => {
                console.error('Erro:', err);
                document.getElementById('agenda-dinamica').innerHTML = '<p>Ainda não existem eventos publicados no painel.</p>';
            });
    </script>
