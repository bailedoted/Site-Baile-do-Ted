<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Baile do Ted</title>
    <style>
        /* TELA DE SENHA */
        #tela-senha {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 99999; display: flex;
            align-items: center; justify-content: center; flex-direction: column;
        }
        .box-senha { background: #111; padding: 30px; border-radius: 10px; border: 1px solid #333; text-align: center; }
        
        /* O SEU CSS ORIGINAL */
        body { background-color: #050505; color: #fff; font-family: sans-serif; padding: 20px; }
        .admin-container { max-width: 900px; margin: 0 auto; background: #111; padding: 30px; border-radius: 10px; border: 1px solid #333; }
        .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border-radius: 5px; border: 1px solid #444; background: #222; color: #fff; }
        label { font-weight: bold; color: #ff007f; font-size: 14px; }
        .btn-salvar { background: #00c853; color: #fff; border: none; padding: 15px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- TELA DE SENHA -->
    <div id="tela-senha">
        <div class="box-senha">
            <h2 style="color: #ff007f;">Acesso Restrito</h2>
            <input type="password" id="senha-input" placeholder="Digite a senha" style="margin: 15px 0; padding: 10px; width: 200px;">
            <button onclick="verificarSenha()" class="btn-salvar" style="margin-top: 0;">Entrar</button>
        </div>
    </div>

    <!-- TODO O SEU CONTEÚDO ORIGINAL AQUI -->
    <div class="admin-container" id="conteudo-admin" style="display: none;">
        <h1 style="text-align: center;">🎛️ Dashboard - Baile do Ted</h1>
        
        <form id="form-evento">
            <input type="hidden" id="eventoId">
            <div class="grid-form">
                <input type="text" id="nome" placeholder="Nome do Evento" required>
                <input type="date" id="data" required>
                <input type="text" id="localNome" placeholder="Nome da Casa">
                <input type="text" id="localEndereco" placeholder="Endereço / Cidade">
                <input type="text" id="localContato" placeholder="WhatsApp">
                <input type="text" id="instagram" placeholder="Instagram (@)">
                <input type="url" id="linkIngresso" placeholder="Link Ingressos">
                <input type="text" id="imagemTexto" placeholder="Ex: img/foto.png">
            </div>
            <button type="submit" class="btn-salvar" id="btn-salvar">Salvar no Banco</button>
        </form>
    </div>

    <!-- SEU SCRIPT ORIGINAL E A LÓGICA DA SENHA -->
    <script type="module">
        // [AQUI VOCÊ MANTÉM TODA A SUA LÓGICA DO FIREBASE QUE JÁ EXISTIA]
        // Se precisar, posso te enviar o código completo com o Firebase integrado novamente!
    </script>

    <script>
        const senhaCorreta = "ted2026"; 

        function verificarSenha() {
            const senhaDigitada = document.getElementById('senha-input').value;
            if (senhaDigitada === senhaCorreta) {
                document.getElementById('tela-senha').style.display = 'none';
                document.getElementById('conteudo-admin').style.display = 'block';
            } else {
                alert("Senha incorreta!");
            }
        }

        document.getElementById("senha-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") { verificarSenha(); }
        });
    </script>
</body>
</html>
