<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Baile do Ted</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { background-color: #050505; color: #fff; font-family: sans-serif; padding: 20px; }
        .admin-container { max-width: 900px; margin: 0 auto; background: #111; padding: 30px; border-radius: 10px; border: 1px solid #333; }
        .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border-radius: 5px; border: 1px solid #444; background: #222; color: #fff; font-size: 14px; box-sizing: border-box; }
        .btn-salvar { background: #00c853; color: #fff; border: none; padding: 15px; width: 100%; font-size: 18px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 20px; }
        .evento-item { display: flex; justify-content: space-between; background: #222; padding: 15px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #333; }
        /* TELA DE SENHA */
        #tela-senha { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 99999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
    </style>
</head>
<body>

    <div id="tela-senha">
        <div style="background: #111; padding: 30px; border-radius: 10px; border: 1px solid #333; text-align: center;">
            <h2 style="color: #ff007f;">Acesso Restrito</h2>
            <input type="password" id="senha-input" placeholder="Digite a senha" style="padding: 10px; width: 200px;">
            <button onclick="verificarSenha()" class="btn-salvar" style="margin-top: 10px;">Entrar</button>
        </div>
    </div>

    <div class="admin-container" id="conteudo-admin" style="display: none;">
        <h1 style="text-align: center;">🎛️ Dashboard - Baile do Ted</h1>
        
        <form id="form-evento">
            <input type="hidden" id="eventoId">
            <div class="grid-form">
                <input type="text" id="nome" placeholder="Nome do Evento" required>
                <input type="date" id="data" required>
                <input type="text" id="localNome" placeholder="Nome da Casa">
                <input type="text" id="localEndereco" placeholder="Endereço">
                <input type="text" id="localContato" placeholder="WhatsApp">
                <input type="text" id="instagram" placeholder="Instagram">
                <input type="url" id="linkIngresso" placeholder="Link Ingressos">
                <input type="text" id="imagemTexto" placeholder="Caminho Imagem">
            </div>
            <button type="submit" class="btn-salvar" id="btn-salvar">Cadastrar Show</button>
        </form>

        <h2>Shows Agendados</h2>
        <div id="lista-eventos"></div>

        <h2 style="margin-top:40px; border-top: 1px solid #333; pt: 20px;">✍️ Gerar Contrato PDF</h2>
        <div class="grid-form">
            <input type="text" id="nomeContratante" placeholder="Nome Contratante">
            <input type="text" id="cpfContratante" placeholder="CPF/CNPJ">
            <input type="text" id="dataContrato" placeholder="Data Evento">
            <input type="text" id="valorContrato" placeholder="Valor R$">
        </div>
        <button onclick="gerarPDF()" class="btn-salvar" style="background: #ff007f;">Gerar Contrato (PDF)</button>

        <h2>📄 Textos Rápidos</h2>
        <textarea id="textoOrcamento" rows="3"></textarea>
        <textarea id="textoContrato" rows="3"></textarea>
        <textarea id="textoInfos" rows="3"></textarea>
        <button id="btn-salvar-textos" class="btn-salvar">💾 Salvar Modelos</button>
    </div>

    <script type="module">
        // [AQUI ESTA TODA A SUA LÓGICA FIREBASE ORIGINAL QUE VOCÊ MANDOU]
        // (Ao colar o código, garanta que o script Firebase completo está aqui)
        // ... (Seu código Firebase original de carregamento e salvamento)
    </script>

    <script>
        // SENHA E ENTER
        const senhaCorreta = "ted2026";
        function verificarSenha() {
            if (document.getElementById('senha-input').value === senhaCorreta) {
                document.getElementById('tela-senha').style.display = 'none';
                document.getElementById('conteudo-admin').style.display = 'block';
            } else { alert("Senha incorreta!"); }
        }
        document.getElementById("senha-input").addEventListener("keypress", (e) => { if (e.key === "Enter") verificarSenha(); });

        // GERADOR PDF
        window.gerarPDF = function() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("CONTRATO BAILE DO TED", 20, 20);
            doc.text("Contratante: " + document.getElementById('nomeContratante').value, 20, 30);
            doc.save("Contrato.pdf");
        };
    </script>
</body>
</html>
