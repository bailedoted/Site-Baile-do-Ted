<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Baile do Ted</title>
    <style>
        #tela-senha {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 99999; display: flex;
            align-items: center; justify-content: center; flex-direction: column;
        }
        .box-senha { background: #111; padding: 30px; border-radius: 10px; border: 1px solid #333; text-align: center; }
        
        body { background-color: #050505; color: #fff; font-family: sans-serif; padding: 20px; }
        .admin-container { max-width: 900px; margin: 0 auto; background: #111; padding: 30px; border-radius: 10px; border: 1px solid #333; }
        .btn-salvar { background: #00c853; color: #fff; border: none; padding: 15px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="tela-senha">
        <div class="box-senha">
            <h2 style="color: #ff007f;">Acesso Restrito</h2>
            <!-- Campo de senha -->
            <input type="password" id="senha-input" placeholder="Digite a senha" style="margin: 15px 0; padding: 10px; width: 200px;">
            <button onclick="verificarSenha()" class="btn-salvar" style="margin-top: 0;">Entrar</button>
        </div>
    </div>

    <div class="admin-container" id="conteudo-admin" style="display: none;">
        <h1 style="text-align: center;">🎛️ Dashboard - Baile do Ted</h1>
        <!-- Restante do conteúdo aqui -->
    </div>

    <script>
        // --- SENHA E TECLA ENTER ---
        
        // 1. Defina sua senha aqui:
        const senhaCorreta = "ted2026"; 

        function verificarSenha() {
            const senhaDigitada = document.getElementById('senha-input').value;
            
            if (senhaDigitada === senhaCorreta) {
                document.getElementById('tela-senha').style.display = 'none';
                document.getElementById('conteudo-admin').style.display = 'block';
            } else {
                alert("Senha incorreta, parceiro!");
            }
        }

        // 2. Faz a tecla Enter funcionar no campo de senha
        document.getElementById("senha-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                verificarSenha();
            }
        });
    </script>
</body>
</html>
